<!DOCTYPE html>
<html lang="mr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>पोषण सारथी – शालेय पोषण आहार व्यवस्थापन</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e3f6fb;--card:#fff;--tx:#1d2b2f;--mut:#5b6e73;--pri:#0f7b8a;--acc:#f0a53a;--ln:#c9e2e8;--in:#f4fafb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1e;--card:#172a2e;--tx:#e6f1f3;--mut:#9ab3b8;--pri:#3cc3d4;--acc:#e0a040;--ln:#27444a;--in:#10201f}}
:root[data-theme="dark"]{--bg:#0e1b1e;--card:#172a2e;--tx:#e6f1f3;--mut:#9ab3b8;--pri:#3cc3d4;--acc:#e0a040;--ln:#27444a;--in:#10201f}
*{box-sizing:border-box}html,body{background:var(--bg)}body{margin:0 auto;color:var(--tx);font-family:system-ui,"Noto Sans Devanagari",sans-serif;padding:10px;max-width:640px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
h1{font-size:17px;margin:0 0 6px;color:var(--pri)}h2{font-size:15px;margin:0 0 8px}.m{color:var(--mut);font-size:12px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
#tabs button{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--ln)}
#tabs button.on{background:var(--pri);color:#fff}
button{border:0;border-radius:8px;padding:9px 12px;background:var(--acc);color:#111;font-weight:700;font-size:14px}
.row{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
input,select{width:100%;padding:8px 4px;border:1px solid var(--ln);border-radius:6px;background:var(--in);color:var(--tx);font-size:14px}
input:disabled{opacity:.35}input[type=radio]{width:auto}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--ln);padding:4px;text-align:center;font-size:12px}
th{background:var(--pri);color:#fff}td.l{text-align:left;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{border:1px solid var(--ln);background:var(--in);border-radius:10px;padding:8px}
.k b{display:block;font-size:20px;color:var(--pri)}.big{grid-column:1/-1;background:var(--pri)}.big b,.big .m{color:#fff}.big b{font-size:28px}
.tg label{display:inline-block;margin-right:12px}.x{background:none;color:#c33;padding:2px 6px}
@media print{#tabs,button,.np{display:none!important}body{background:#fff;color:#000}.c{border:0}}
